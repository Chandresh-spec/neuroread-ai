name: CI

on:
   push:
   pull_request:


jobs:
    test:
      runs-on: ubuntu-latest

      steps:
          - name: checkout-code
            uses: actions/checkout@v3

          - name:  install-python
            uses: actions/setup-python@v5

          - name: install-depedencies
            run: |
                 pip install -r requirements.txt 
                 pytest
          




