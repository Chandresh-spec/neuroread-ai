version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuroreader_web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/preferences/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: neuroreader_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

volumes:
  sqlite_data:
  media_data:
